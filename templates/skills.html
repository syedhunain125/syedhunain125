{% extends 'base.html' %}

{% block content %}
<section id="skills">
  <h2>Skills</h2>
  <div class="skills-list">
    <div class="skill">Python</div>
    <div class="skill">Django</div>
    <div class="skill">Flask</div>
    <div class="skill">Power BI</div>
    <div class="skill">Cybersecurity</div>
    <div class="skill">Machine Learning</div>
    <div class="skill">Computer Vision</div>
    <div class="skill">Oracle APEX</div>
    <div class="skill">Java</div>
    <div class="skill">C++</div>
    <div class="skill">Web Scraping</div>
  </div>
</section>

<style>
  .skills-list {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 30px;
    justify-content: center;
  }
  .skill {
    background: rgba(168, 85, 247, 0.15);
    padding: 10px 20px;
    border-radius: 25px;
    font-weight: 600;
    font-size: 1rem;
    color: #eee;
    box-shadow: 0 4px 8px rgba(168, 85, 247, 0.2);
    border: 2px solid transparent;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .skill::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(60deg, #a855f7, #ec4899, #f97316, #3b82f6, #a855f7);
    background-size: 400% 400%;
    filter: blur(20px);
    opacity: 0;
    transition: opacity 0.5s ease;
    z-index: 0;
    animation: gradientShift 12s linear infinite;
  }
  .skill:hover::before {
    opacity: 0.3;
  }
  .skill:hover {
    box-shadow: 0 8px 15px rgba(236, 72, 153, 0.6);
    border-color: #ec4899;
    transform: translateY(-5px) scale(1.05);
  }
  .skill span {
    position: relative;
    z-index: 1;
    background: linear-gradient(270deg, #a855f7, #ec4899, #f97316, #3b82f6, #a855f7);
    background-size: 1000% 1000%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 8s ease infinite;
  }

  /* Animation Keyframes */
  @keyframes gradientShift {
    0% {
      background-position: 0% 50%;
    }
    50% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0% 50%;
    }
  }

  /* Responsive tweaks */
  @media (max-width: 480px) {
    .skills-list {
      gap: 10px;
    }
    .skill {
      font-size: 0.9rem;
      padding: 8px 16px;
    }
  }
</style>
{% endblock %}
