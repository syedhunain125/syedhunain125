{% block content %}

  <div class="intro-content">
    <div class="intro-image-card">
      <img src="{{ url_for('static', filename='images/profile_pic.jpg') }}" alt="Syed Hunain Profile" id="profile-image" onload="console.log('Profile image loaded successfully')" onerror="console.error('Profile image failed to load'); this.src='https://via.placeholder.com/300?text=Image+Not+Found';">

    <div class="intro-text">

<section id="contact">

      <textarea name="message" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>
  <div class="contact-info-below">
    Or reach me directly at: 
    <a href="mailto:syedhunainali27@gmail.com">syedhunainali27@gmail.com</a> | 
    Phone: +92 3259598474 | 
    LinkedIn: <a href="https://linkedin.com/in/syedhunain" target="_blank" rel="noopener">linkedin.com/in/syedhunain</a>
  </div>
</section>
